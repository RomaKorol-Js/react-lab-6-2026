<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="../final/style.css" />
  </head>
  <body>
    <div class="dashboard-layout">
      <!-- Sidebar -->
      <aside class="sidebar">
        <div class="sidebar-brand">Dashboard</div>
        <nav class="sidebar-nav">
          <a href="#" class="nav-item active">Overview</a>
          <a href="#" class="nav-item">Analytics</a>
          <a href="#" class="nav-item">Users</a>
          <a href="#" class="nav-item">Settings</a>
        </nav>
      </aside>

      <!-- Main Content Area -->
      <main class="main-content">
        <!-- Header -->
        <header class="header">
          <button class="menu-toggle" aria-label="Toggle Menu">☰</button>
          <h1 class="page-title">Overview</h1>
          <div class="user-profile">JD</div>
        </header>

        <!-- Dashboard Content -->
        <div class="content-body">
          <!-- Grid of Cards -->
          <section class="cards-grid">
            <div class="card">
              <h3>Total Users</h3>
              <p class="card-value">12,480</p>
              <span class="card-trend positive">+12% this month</span>
            </div>
            <div class="card">
              <h3>Revenue</h3>
              <p class="card-value">$34,250</p>
              <span class="card-trend positive">+8.4% this month</span>
            </div>
            <div class="card">
              <h3>Active Sessions</h3>
              <p class="card-value">1,429</p>
              <span class="card-trend negative">-2.1% today</span>
            </div>
            <div class="card">
              <h3>Conversion Rate</h3>
              <p class="card-value">3.24%</p>
              <span class="card-trend positive">+0.5% this week</span>
            </div>
          </section>
        </div>
      </main>
    </div>
  </body>
</html>
